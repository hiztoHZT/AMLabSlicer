syntax = "proto3";

package amlabslicer.proto;

option csharp_namespace = "AMLabSlicer.Grpc";

service SlicerService {
    rpc GetAvailableAlgorithms(Empty) returns (AlgorithmList);
    rpc GetAlgorithmParameters(AlgorithmRequest) returns (ParameterTemplateList);
    rpc Slice(stream SliceClientMessage) returns (stream SliceServerMessage);
}

message Empty {}

message AlgorithmInfo {
    string algorithm_id = 1;
    string display_name = 2;
    string engine_id = 3;
    string category = 4;
    string version = 5;
    repeated string capabilities = 6;
    repeated string input_kinds = 7;
    repeated string output_kinds = 8;
}

message AlgorithmList {
    repeated AlgorithmInfo algorithms = 1;
}

message AlgorithmRequest {
    string algorithm_id = 1;
}

enum ValueType {
    VT_BOOL = 0;
    VT_INT = 1;
    VT_FLOAT = 2;
    VT_STRING = 3;
    VT_ENUM = 4;
}

enum ControlType {
    CHECK_BOX = 0;
    NUMERIC_BOX = 1;
    SLIDER = 2;
    COMBO_BOX = 3;
    TEXT_BOX = 4;
    OBJECT_SELECTOR = 5;
    FILE_PICKER = 6;
}

message ParameterTemplate {
    string key = 1;
    string display_name = 2;
    string category = 3;
    string subcategory = 4;
    int32 order = 5;
    ValueType value_type = 6;
    ControlType control_type = 7;
    string default_value = 8;
    double min_value = 9;
    double max_value = 10;
    double step = 11;
    repeated string options = 12;
    string unit = 13;
    string description = 14;
    bool is_advanced = 15;
    string visible_if = 16;
    string enabled_if = 17;
}

message ParameterTemplateList {
    repeated ParameterTemplate parameters = 1;
}

message ParameterValue {
    oneof value {
        bool bool_value = 1;
        int64 int_value = 2;
        double double_value = 3;
        string string_value = 4;
    }
}

message MeshObject {
    int64 id = 1;
    string name = 2;
    bytes vertices = 3;
    bytes normals = 4;
    bytes indices = 5;
    map<string, ParameterValue> override_parameters = 6;
    repeated float transform_matrix = 7;
    string units = 8;
    string coordinate_system = 9;
    bool transform_applied = 10;
}

message FiveAxisConfig {
    bool is_enabled = 1;
    string kinematics_type = 2;
    double pivot_x = 3;
    double pivot_y = 4;
    double pivot_z = 5;
}

message SliceRequest {
    string algorithm_id = 1;
    map<string, ParameterValue> parameters = 2;
    repeated MeshObject objects = 3;
    FiveAxisConfig five_axis_config = 4;
    string request_id = 5;
}

message SliceClientMessage {
    oneof msg {
        SliceRequest start_request = 1;
        bool cancel_request = 2;
    }
}

message SliceProgress {
    float progress = 1;
    string current_stage = 2;
}

message LogMessage {
    enum LogLevel {
        INFO = 0;
        WARNING = 1;
        ERROR = 2;
        DEBUG = 3;
    }
    LogLevel level = 1;
    string text = 2;
}

message LayerPreview {
    int32 layer_id = 1;
    float z_height = 2;
    bytes path_data = 3;
    string encoding = 4;
    string coordinate_space = 5;
    string units = 6;
    string schema_version = 7;
}

message Artifact {
    string kind = 1;
    string mime_type = 2;
    string file_name = 3;
    bytes data = 4;
    map<string, string> metadata = 5;
}

message ErrorInfo {
    string code = 1;
    string message = 2;
    bool recoverable = 3;
    map<string, string> details = 4;
}

message SliceResult {
    bool success = 1;
    string message = 2;
    repeated Artifact artifacts = 3;
    int32 total_layers = 4;
    double estimated_time_sec = 5;
    double filament_used_mm = 6;
    ErrorInfo error = 7;
}

message SliceServerMessage {
    oneof msg {
        SliceProgress progress = 1;
        LogMessage log = 2;
        LayerPreview layer_preview = 3;
        SliceResult result = 4;
    }
}
